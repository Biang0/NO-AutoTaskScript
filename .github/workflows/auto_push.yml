name: 自动push防止Actions自动停止

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1,15 * *'
  repository_dispatch:
    types: [start_action]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    if: github.event.repository.owner.id == github.event.sender.id || ! github.event.sender.id || github.actor == 'BlueSkyClouds'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 配置Git
        run: |
          git config --global user.name "Biang0"
          git config --global user.email "wangyuan0999@gmail.com"

      - name: 创建空提交
        run: git commit --allow-empty -m "Auto keep alive"

      - name: 推送到script分支
        run: git push origin HEAD:script
