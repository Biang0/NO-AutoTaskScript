name: 自动push防止Actions自动停止

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1,15 * *'
  repository_dispatch:
    types: [start_action]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id || ! github.event.sender.id || github.actor == 'BlueSkyClouds'

    steps:
      - name: 纯Shell克隆仓库（彻底消除Node.js警告）
        run: |
          git config --global init.defaultBranch script
          git clone https://${{ github.repository_owner }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git tmp_repo
          cd tmp_repo
          git checkout script

      - name: 配置Git信息
        run: |
          cd tmp_repo
          git config user.name "Biang0"
          git config user.email "wangyuan0999@gmail.com"

      - name: 创建空提交
        run: |
          cd tmp_repo
          git commit --allow-empty -m "Auto keep alive"

      - name: 推送提交
        run: |
          cd tmp_repo
          git push origin script
