name: 自动push防止Actions自动停止

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1,15 * *'
  repository_dispatch:
    types: [start_action]

jobs:
  build:
    runs-on: ubuntu-latest
    # 安全权限判断
    if: github.event.repository.owner.id == github.event.sender.id || ! github.event.sender.id || github.actor == 'BlueSkyClouds'

    steps:
      # 升级到 v4，解决 Node.js 20 弃用警告
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Re setting the url for `origin`
        run: |
          git remote set-url origin https://${{ github.repository_owner }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Adding git info
        run: |
          git config --global user.name "Biang0"
          git config --global user.email "wangyuan0999@gmail.com"

      - name: Creating an empty commit
        run: |
          git commit --allow-empty -m "Auto amazing commit"

      - name: Finally pushing the repo
        run: |
          git push origin HEAD:script
